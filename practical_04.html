<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEasy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body class="bg-gray-50 text-gray-800">
  <nav class="flex items-center justify-between bg-indigo-600 px-6 py-4 text-white">
    <h1 class="text-2xl font-bold">ShopEasy</h1>
    <div class="space-x-4">
      <a href="#home" class="hover:text-indigo-200">Home</a>
      <a href="#products" class="hover:text-indigo-200">Products</a>
      <a href="#contact" class="hover:text-indigo-200">Contact</a>
    </div>
  </nav>

  <section id="home" class="bg-indigo-100 px-6 py-16 text-center">
    <h2 class="text-4xl font-bold text-indigo-700">Welcome to ShopEasy</h2>
    <p class="mt-3 text-gray-600">Simple products. Great prices.</p>
    <a href="#products" class="mt-6 inline-block rounded bg-indigo-600 px-6 py-3 font-semibold text-white hover:bg-indigo-700">Shop now</a>
  </section>

  <section id="products" class="mx-auto max-w-6xl px-6 py-12">
    <h2 class="mb-8 text-center text-3xl font-bold">Popular Products</h2>

    <div class="grid gap-6 sm:grid-cols-2 md:grid-cols-3">
      <div class="overflow-hidden rounded-lg bg-white shadow">
        <img src="https://m.media-amazon.com/images/I/41i357e-zIL._AC_UY1100_.jpg" alt="Sport t-shirt" class="h-56 w-full object-cover">
        <div class="p-5"><h3 class="text-xl font-semibold">Sport T-Shirt</h3><p class="mt-2 text-gray-600"> ₹ 499 </p><button class="mt-4 w-full rounded bg-indigo-600 py-2 text-white hover:bg-indigo-700">Add to Cart</button></div>
      </div>

      <div class="overflow-hidden rounded-lg bg-white shadow">
        <img src="https://m.media-amazon.com/images/I/71O8-ltHVAL.jpg" alt="Kit" class="h-56 w-full object-cover">
        <div class="p-5"><h3 class="text-xl font-semibold">Cricket Kit</h3><p class="mt-2 text-gray-600"> ₹ 4,999</p><button class="mt-4 w-full rounded bg-indigo-600 py-2 text-white hover:bg-indigo-700">Add to Cart</button></div>
      </div>

      <div class="overflow-hidden rounded-lg bg-white shadow">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuvNGVGqmi1pPWa-p8a7POFQCCUgcqPTGZ4P7WHdia9w&s=10%22" alt="Badminton" class="h-56 w-full object-cover">
        <div class="p-5"><h3 class="text-xl font-semibold">Badminton</h3><p class="mt-2 text-gray-600"> ₹ 999 </p><button class="mt-4 w-full rounded bg-indigo-600 py-2 text-white hover:bg-indigo-700">Add to Cart</button></div>
      </div>
    </div>
  </section>

  <footer id="contact" class="bg-gray-900 py-6 text-center text-white">
    <p>© 2026 ShopEasy. All rights reserved.</p>
  </footer>
</body>
</html>
