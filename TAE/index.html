<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEasy</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">
    <nav class="bg-indigo-600 text-white p-4">

        <div class="max-w-6xl mx-auto flex justify-between">

            <h1 class="text-2xl font-bold">
                ShopEasy
            </h1>

            <div class="space-x-4">
                <a href="#home">Home</a>
                <a href="#products">Products</a>
                <a href="#contact">Contact</a>
            </div>

        </div>

    </nav>
    <section id="home"
             class="bg-white text-center py-16">

        <h2 class="text-4xl font-bold">
            Welcome to ShopEasy
        </h2>

        <p class="mt-4 text-gray-600">
            Find the best products at the best prices.
        </p>

    </section>
    <section id="products"
             class="max-w-6xl mx-auto p-6">

        <h2 class="text-3xl font-bold text-center">
            Our Products
        </h2>
        <div class="flex flex-col sm:flex-row
                    gap-4 justify-center my-8">
            <select id="categoryFilter"
                    class="p-2 border rounded">
                <option value="all">
                    All Categories
                </option>
                <option value="Clothing">
                    Clothing
                </option>
                <option value="Cricket">
                    Cricket
                </option>
                <option value="Badminton">
                    Badminton
                </option>

            </select>

            <select id="priceFilter"
                    class="p-2 border rounded">

                <option value="all">
                    All Prices
                </option>

                <option value="low">
                    Below ₹1000
                </option>

                <option value="medium">
                    ₹1000 - ₹5000
                </option>

                <option value="high">
                    Above ₹5000
                </option>

            </select>

        </div>

        <div id="productList"
             class="grid grid-cols-1
                    sm:grid-cols-2
                    lg:grid-cols-3
                    gap-6">

        </div>

    </section>
    <section id="contact"
             class="bg-white text-center p-10">

        <h2 class="text-3xl font-bold">
            Contact Us
        </h2>

        <p class="mt-3">
            Email: support@shopeasy.com
        </p>

    </section>
    <footer class="bg-indigo-600 text-white text-center p-4">

        © 2026 ShopEasy

    </footer>
    <script>

        const products = [

            {
                name: "Sport T-Shirt",
                price: 499,
                category: "Clothing",
                image: "https://m.media-amazon.com/images/I/41i357e-zIL._AC_UY1100_.jpg"
            },

            {
                name: "Cricket Kit",
                price: 4999,
                category: "Cricket",
                image: "https://m.media-amazon.com/images/I/71O8-ltHVAL.jpg"
            },

            {
                name: "Badminton",
                price: 999,
                category: "Badminton",
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuvNGVGqmi1pPWa-p8a7POFQCCUgcqPTGZ4P7WHdia9w&s"
            }

        ];


        // Show products
        function showProducts(list) {

            let output = "";

            list.forEach(function(product) {

                output += `

                    <div class="bg-white
                                rounded
                                shadow
                                p-4">

                        <img
                            src="${product.image}"
                            class="w-full
                                   h-48
                                   object-cover"
                        >

                        <h3 class="text-xl
                                   font-bold
                                   mt-3">

                            ${product.name}

                        </h3>

                        <p class="text-gray-500">

                            ${product.category}

                        </p>

                        <p class="font-bold
                                  mt-2">

                            ₹${product.price}

                        </p>


                        <!-- Add To Cart -->
                        <button
                            class="cartButton
                                   bg-indigo-600
                                   text-white
                                   px-4
                                   py-2
                                   rounded
                                   mt-3
                                   w-full">

                            Add to Cart

                        </button>

                    </div>

                `;

            });


            document.getElementById("productList")
                    .innerHTML = output;


            // Add button functionality
            const buttons =
                document.querySelectorAll(".cartButton");


            buttons.forEach(function(button) {

                button.addEventListener("click", function() {

                    if (button.innerText === "Add to Cart") {

                        button.innerText = "Added ✓";

                        button.classList.remove(
                            "bg-indigo-600"
                        );

                        button.classList.add(
                            "bg-green-600"
                        );

                    }

                    else {

                        button.innerText = "Add to Cart";

                        button.classList.remove(
                            "bg-green-600"
                        );

                        button.classList.add(
                            "bg-indigo-600"
                        );

                    }

                });

            });

        }


        // Filter products
        function filterProducts() {

            let category =
                document.getElementById(
                    "categoryFilter"
                ).value;


            let price =
                document.getElementById(
                    "priceFilter"
                ).value;


            let result = products.filter(
                function(product) {

                    // Category
                    let categoryOK =
                        category === "all" ||
                        product.category === category;


                    // Price
                    let priceOK = true;


                    if (price === "low") {

                        priceOK =
                            product.price < 1000;

                    }


                    if (price === "medium") {

                        priceOK =
                            product.price >= 1000 &&
                            product.price <= 3000;

                    }


                    if (price === "high") {

                        priceOK =
                            product.price > 3000;

                    }


                    return categoryOK && priceOK;

                }
            );


            showProducts(result);

        }

        document.getElementById("categoryFilter")
            .addEventListener(
                "change",
                filterProducts
            );

        document.getElementById("priceFilter")
            .addEventListener(
                "change",
                filterProducts
            );

        showProducts(products);

    </script>

</body>

</html>
