<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-blue-50 flex items-center justify-center p-5">
  <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-7">
    <h1 class="text-2xl font-bold text-center text-blue-700">
      Student Registration
    </h1>
    <p class="text-center text-gray-500 mt-1 mb-6">College Admission Portal</p>

    <form id="registrationForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Full Name</label>
        <input id="name" type="text" class="w-full border rounded-lg p-2 focus:outline-blue-500" />
        <p id="nameError" class="text-red-500 text-sm mt-1"></p>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Email Address</label>
        <input id="email" type="text" class="w-full border rounded-lg p-2 focus:outline-blue-500" />
        <p id="emailError" class="text-red-500 text-sm mt-1"></p>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Mobile Number</label>
        <input id="mobile" type="text" placeholder="10-digit mobile number"
          class="w-full border rounded-lg p-2 focus:outline-blue-500" />
        <p id="mobileError" class="text-red-500 text-sm mt-1"></p>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input id="password" type="password" class="w-full border rounded-lg p-2 focus:outline-blue-500" />
        <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
      </div>

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
        Register
      </button>

      <p id="successMessage" class="text-green-600 font-medium text-center"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById("registrationForm");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      // Get form values
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const password = document.getElementById("password").value;

      // Clear previous messages
      document.querySelectorAll("[id$='Error']").forEach(el => el.textContent = "");
      document.getElementById("successMessage").textContent = "";

      let isValid = true;

      // Name validation
      if (name === "") {
        document.getElementById("nameError").textContent = "Name is required.";
        isValid = false;
      }

      // Email validation
      const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/i;
      if (email === "") {
        document.getElementById("emailError").textContent = "Email is required.";
        isValid = false;
      } else if (!emailPattern.test(email)) {
        document.getElementById("emailError").textContent = "Enter a valid email address.";
        isValid = false;
      }

      // Mobile validation (10 digits)
      const mobilePattern = /^[0-9]{10}$/;
      if (mobile === "") {
        document.getElementById("mobileError").textContent = "Mobile number is required.";
        isValid = false;
      } else if (!mobilePattern.test(mobile)) {
        document.getElementById("mobileError").textContent = "Enter a valid 10-digit mobile number.";
        isValid = false;
      }

      // Password validation
      if (password === "") {
        document.getElementById("passwordError").textContent = "Password is required.";
        isValid = false;
      } else if (password.length < 6) {
        document.getElementById("passwordError").textContent = "Password must be at least 6 characters.";
        isValid = false;
      }

      // Submit success
      if (isValid) {
        document.getElementById("successMessage").textContent =
          "Registration submitted successfully!";
        form.reset();
      }
    });
  </script>
</body>
</html>
